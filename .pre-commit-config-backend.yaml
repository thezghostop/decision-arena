repos:
  # ── General quality ────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: ^backend/
      - id: end-of-file-fixer
        files: ^backend/
      - id: check-yaml
        files: ^backend/
      - id: check-toml
        files: ^backend/
      - id: check-merge-conflict
        files: ^backend/
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        files: ^backend/

  # ── Lint (ruff) ────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Format (pyupgrade) ────────────────────────────────────
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.16.0
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]
        files: ^backend/

  # ── Type Check (mypy) ─────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^backend/app/
        args: ["--ignore-missing-imports", "--explicit-package-bases"]
        additional_dependencies:
          - pydantic
          - fastapi

  # ── Security (gitleaks) ───────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Security (bandit) ─────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "backend/pyproject.toml", "-r", "backend/app/"]
        files: ^backend/

  # ── Quality (vulture) ─────────────────────────────────────
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: ["backend/app/", "--min-confidence", "80"]
        files: ^backend/
